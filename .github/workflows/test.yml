name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported CPython, plus the free-threaded builds ("t") from 3.14 on.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      AUTHZ_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-extras --frozen
      - name: Report the interpreter
        run: uv run python -VV
      # A dependency without free-threading support turns the GIL back on at import; fail if so.
      - name: Check that the GIL stays off
        if: endsWith(matrix.python-version, 't')
        run: >-
          uv run python -c "import sys, authz, aiosqlite, asyncpg, fastapi;
          from authz import PostgresStorage;
          sys.exit(1 if sys._is_gil_enabled() else 0)"
      - run: uv run pytest -q -W error::DeprecationWarning
