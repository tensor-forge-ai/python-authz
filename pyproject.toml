[project]
name = "python-authz"
version = "0.8.1"
description = "A framework-agnostic ReBAC/RBAC/ABAC authorization engine built on one Zanzibar-style relationship graph"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anupam Gupta", email = "anupam@trois.in" }]
requires-python = ">=3.11"
dependencies = ["aiosqlite>=0.21.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tensor-forge-ai/python-authz"
Repository = "https://github.com/tensor-forge-ai/python-authz"
Issues = "https://github.com/tensor-forge-ai/python-authz/issues"

[project.optional-dependencies]
fastapi = ["fastapi>=0.141.1"]
postgres = ["asyncpg>=0.31.0"]

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "pyjwt>=2.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-multipart>=0.0.20",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv.build-backend]
module-name = "authz"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
